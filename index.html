<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #000;
    --text: #fff;
    --muted: #666;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 2rem;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(4rem, 10vw, 7rem);
    font-weight: 700;
    letter-spacing: -0.09em;
    line-height: 1;
  }

  .subtitle {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .socials {
    margin-top: 1rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .socials a {
    color: var(--muted);
    text-decoration: none;
    font-family: "JetBrains Mono", monospace;
    font-size: 1rem;
    transition: color 0.2s ease;
  }

  .socials a:hover {
    color: var(--text);
  }
</style>

</head>

<body>

<main class="container">

  <h1>SagarShips</h1>

  <p class="subtitle">
    build • break • learn • ship
  </p>

  <div class="socials">
    <a
      href="https://x.com/sagarships"
      target="_blank"
      rel="noopener noreferrer"
    >
      X
    </a>

  </div>

</main>

<script>
  const emojis = ["🌊", "🚢"];
  let index = 0;

  function setFavicon(emoji) {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <text y=".9em" font-size="90">${emoji}</text>
      </svg>
    `;

    const url =
      "data:image/svg+xml," + encodeURIComponent(svg);

    document
      .getElementById("favicon")
      .setAttribute("href", url);
  }

  setFavicon(emojis[0]);

  setInterval(() => {
    index = (index + 1) % emojis.length;
    setFavicon(emojis[index]);
  }, 3000);

  console.log(`
🚢 SagarShips

build • break • learn • ship

Thanks for peeking behind the curtain.
`);
</script>

</body>
